name: Inputs Demo
on: 
  workflow_dispatch:
    inputs:
      environment: 
        description: Choose the env to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      tag:
        description: Choose the tag to deploy
        required: true

jobs:
   inputs-demo:
     runs-on: ubuntu-latest
     steps:
       - name: Deploy the app
         run: echo "Deploy the ${{inputs.tag}} application on ${{ inputs.environment }}"
      
