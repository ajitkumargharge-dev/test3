name: context variables demo
on: push
jobs:
  context-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use context variables
        run: |
         echo "This workflow is triggereed by ${{ github.actor }}"
         echo "The repo name is ${{ github.repository }}"

      - name: Print all the github context-variables
        run: echo "${{toJSON(github)}}"
      
